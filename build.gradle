plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.goias'
version = '0.0.1-SNAPSHOT'
description = 'Sistema de Chamado - Goiás Esporte Clube'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web + telas
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Segurança
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Banco
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Desenvolvimento
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testes
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Mantém os nomes dos parâmetros (necessário para @PathVariable/@RequestParam sem nome explícito)
    options.compilerArgs << '-parameters'
}

tasks.named('bootRun') {
    // Sobe com o perfil dev por padrão (./gradlew bootRun)
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'dev')
}

// Etapa 5: o "./gradlew bootJar" gera sempre build/libs/chamados.jar (nome fixo, usado no guia de implantação
// e no serviço do Windows). O jar "plain" (sem as bibliotecas) não é usado, então fica desligado.
tasks.named('bootJar') {
    archiveFileName = 'chamados.jar'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
