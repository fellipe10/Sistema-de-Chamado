<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Conteúdo comum das páginas de erro (templates/error/*.html).
    Nunca mostra detalhes técnicos (stack trace, mensagem da exceção): só o código e um texto amigável.
-->
<div th:fragment="conteudo(icone, codigo, titulo, texto)" class="corpo tela-erro">
    <span class="icone-erro" aria-hidden="true"><i class="bi" th:classappend="${icone}"></i></span>
    <div class="d-flex flex-column gap-2">
        <span class="codigo-erro" th:text="'Erro ' + ${codigo}">Erro 404</span>
        <h2 th:text="${titulo}">Página não encontrada</h2>
        <p th:text="${texto}">Texto explicando o que aconteceu.</p>
    </div>
    <div class="d-flex gap-2 flex-wrap justify-content-center">
        <a th:href="@{/}" class="btn btn-secundario" data-voltar>
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar
        </a>
        <a th:href="@{/}" class="btn btn-primary">
            <i class="bi bi-house" aria-hidden="true"></i> Ir para o início
        </a>
    </div>
    <script>
        /* "Voltar" usa o histórico do navegador; sem histórico, vai para o início. */
        (function () {
            var botao = document.querySelector('[data-voltar]');
            if (!botao || window.history.length <= 1) return;
            botao.addEventListener('click', function (e) { e.preventDefault(); window.history.back(); });
        })();
    </script>
</div>
</body>
</html>
