<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/interno}">
<head>
    <title>Configurações</title>
</head>
<body>
<th:block layout:fragment="conteudo">

    <div class="cabecalho-pagina">
        <div>
            <h1>Configurações</h1>
            <p>Cadastros e regras do sistema. Só administradores veem esta página.</p>
        </div>
    </div>

    <div class="alert alert-warning mb-0 d-flex gap-2 align-items-start flex-wrap" role="status" th:if="${avisoFeriados != null}">
        <i class="bi bi-calendar-x" aria-hidden="true"></i>
        <span class="flex-grow-1" th:text="${avisoFeriados}">Ainda não há feriados cadastrados para 2028.</span>
        <a th:href="@{/admin/feriados}" class="fw-semibold">Cadastrar feriados</a>
    </div>

    <div class="grade-cadastros">
        <a class="card-cadastro" th:each="c : ${cards}" th:href="@{${c.url()}}">
            <span class="icone-cadastro" aria-hidden="true"><i class="bi" th:classappend="${c.icone()}"></i></span>
            <span class="textos">
                <span class="nome" th:text="${c.nome()}">Usuários</span>
                <span class="descricao" th:text="${c.descricao()}">Atendentes, gestores e administradores.</span>
            </span>
            <span class="quantidade" th:if="${c.quantidade() != null}">
                <strong class="tabular" th:text="${c.quantidade()}">5</strong>
                <span th:text="${c.rotulo()}">ativos</span>
            </span>
            <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
        </a>
    </div>
</th:block>
</body>
</html>
